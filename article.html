<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article — Dartmouth Web</title>
<link rel="stylesheet" href="css/core.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">DARTMOUTH <span class="dim">/web</span></a>
    <nav class="navlinks">
      <a href="index.html">home</a>
      <a href="article-new.html" data-when-can-publish style="display:none;">write</a>
      <a href="admin.html" data-when-admin style="display:none;">admin</a>
    </nav>
    <div class="btn-row">
      <button class="btn" data-open-auth data-when-signed-out>sign in</button>
      <span data-when-signed-in style="display:none;" class="btn-row">
        <span class="stamp"><span data-user-name>Account</span></span>
        <button class="btn btn-ghost" data-signout>sign out</button>
      </span>
    </div>
  </div>
</header>

<main>
  <section class="wrap section" style="max-width:720px;">
    <div data-article-root>
      <p class="muted">Loading…</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot-inner">
    <span class="muted" style="font-family:var(--mono); font-size:12.5px;">DARTMOUTH WEB</span>
    <div class="foot-links"><a href="index.html">home</a></div>
  </div>
</footer>

<!-- ============ AUTH MODAL ============ -->
<div class="modal-backdrop" data-auth-modal>
  <div class="modal">
    <div class="win modal-shell">
      <button class="close-x" data-close-auth aria-label="Close">[ x ]</button>
      <div class="tabs">
        <div class="tab active" data-auth-tab="signin">sign in</div>
        <div class="tab" data-auth-tab="signup">create account</div>
      </div>
      <div class="win-body">
        <div class="authpane active" data-auth-pane="signin">
          <form data-signin-form>
            <label class="field"><span>email</span><input type="email" name="email" required></label>
            <label class="field"><span>password</span><input type="password" name="password" required></label>
            <p class="field-error" data-form-error></p>
            <button type="submit" class="btn btn-solid" style="width:100%; justify-content:center;">sign in</button>
          </form>
          <div class="or-divider">or</div>
          <button class="btn btn-google" data-google-signin>Continue with Google</button>
        </div>
        <div class="authpane" data-auth-pane="signup">
          <form data-signup-form>
            <label class="field"><span>display name</span><input type="text" name="name" required></label>
            <label class="field"><span>email</span><input type="email" name="email" required></label>
            <label class="field"><span>password</span><input type="password" name="password" minlength="6" required></label>
            <p class="field-hint">At least 6 characters.</p>
            <p class="field-error" data-form-error></p>
            <button type="submit" class="btn btn-solid" style="width:100%; justify-content:center;">create account</button>
          </form>
          <div class="or-divider">or</div>
          <button class="btn btn-google" data-google-signin>Continue with Google</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module">
  import { fetchArticle } from "./js/articles.js";

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderBlock(b){
    if(b.type === 'text'){
      return `<p>${escapeHtml(b.content).replace(/\n\n+/g,'</p><p>')}</p>`;
    }
    if(b.type === 'image'){
      return `<figure><img src="${b.url}" alt="${escapeHtml(b.caption||'')}">${b.caption ? `<figcaption>${escapeHtml(b.caption)}</figcaption>` : ''}</figure>`;
    }
    return '';
  }

  function renderReferences(refs){
    if(!refs || !refs.length) return '';
    return `
      <div class="hr-dash" style="border-top:1px dashed var(--border); margin:40px 0 24px;"></div>
      <h3 style="font-family:var(--mono); color:var(--green);">References</h3>
      <ul style="font-family:var(--mono); font-size:13.5px; padding-left:20px;">
        ${refs.map(r => `<li><a href="${r.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.label)}</a></li>`).join('')}
      </ul>`;
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const root = document.querySelector('[data-article-root]');

  if(!id){
    root.innerHTML = '<p class="muted">No article specified.</p>';
  } else {
    fetchArticle(id).then(article => {
      if(!article){
        root.innerHTML = '<p class="muted">This article doesn\'t exist, or was removed.</p>';
        return;
      }
      root.innerHTML = `
        <span class="stamp"><b>${article.category || 'general'}</b> · by ${escapeHtml(article.authorName)}</span>
        <h1 style="margin-top:16px;">${escapeHtml(article.title)}</h1>
        <div class="reading">
          ${article.body.map(renderBlock).join('')}
          ${renderReferences(article.references)}
        </div>
      `;
    }).catch(err => {
      root.innerHTML = '<p class="muted">Couldn\'t load this article.</p>';
      console.error(err);
    });
  }
</script>
</body>
</html>
