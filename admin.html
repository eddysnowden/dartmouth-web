<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Dartmouth Web</title>
<link rel="stylesheet" href="css/core.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">DARTMOUTH <span class="dim">/web</span></a>
    <nav class="navlinks">
      <a href="index.html">home</a>
      <a href="article-new.html" data-when-can-publish style="display:none;">write</a>
      <a href="admin.html" class="active">admin</a>
    </nav>
    <div class="btn-row">
      <button class="btn" data-open-auth data-when-signed-out>sign in</button>
      <span data-when-signed-in style="display:none;" class="btn-row">
        <span class="stamp"><span data-user-name>Account</span></span>
        <button class="btn btn-ghost" data-signout>sign out</button>
      </span>
    </div>
  </div>
</header>

<main>
  <section class="wrap section">

    <div data-not-admin>
      <div class="banner">This page is for Dartmouth Collective administrators only.</div>
    </div>

    <div data-admin-root style="display:none;">
      <h1>Admin dashboard</h1>
      <p class="stamp" style="margin-bottom:30px;"><b data-my-tier>—</b> logged in</p>

      <!-- ============ USERS ============ -->
      <h2>Users</h2>
      <div class="win" style="margin-bottom:16px;">
        <div class="win-body" style="display:flex; gap:10px;">
          <input type="text" data-user-search placeholder="Search by display name…"
            style="flex:1; font-family:var(--mono); font-size:13px; color:#fff; background:var(--bg-1); border:1px solid var(--border-lit); border-radius:3px; padding:9px 10px;">
          <button class="btn" data-user-search-btn>search</button>
          <button class="btn btn-ghost" data-user-reset-btn>reset</button>
        </div>
      </div>
      <div data-user-list><p class="muted">Loading users…</p></div>

      <div class="section-head" style="margin-top:56px;"><h2>Articles</h2></div>
      <div data-article-list><p class="muted">Loading articles…</p></div>

    </div>
  </section>
</main>

<footer>
  <div class="wrap foot-inner">
    <span class="muted" style="font-family:var(--mono); font-size:12.5px;">DARTMOUTH WEB</span>
    <div class="foot-links"><a href="index.html">home</a></div>
  </div>
</footer>

<!-- ============ AUTH MODAL ============ -->
<div class="modal-backdrop" data-auth-modal>
  <div class="modal">
    <div class="win modal-shell">
      <button class="close-x" data-close-auth aria-label="Close">[ x ]</button>
      <div class="tabs">
        <div class="tab active" data-auth-tab="signin">sign in</div>
        <div class="tab" data-auth-tab="signup">create account</div>
      </div>
      <div class="win-body">
        <div class="authpane active" data-auth-pane="signin">
          <form data-signin-form>
            <label class="field"><span>email</span><input type="email" name="email" required></label>
            <label class="field"><span>password</span><input type="password" name="password" required></label>
            <p class="field-error" data-form-error></p>
            <button type="submit" class="btn btn-solid" style="width:100%; justify-content:center;">sign in</button>
          </form>
          <div class="or-divider">or</div>
          <button class="btn btn-google" data-google-signin>Continue with Google</button>
        </div>
        <div class="authpane" data-auth-pane="signup">
          <form data-signup-form>
            <label class="field"><span>display name</span><input type="text" name="name" required></label>
            <label class="field"><span>email</span><input type="email" name="email" required></label>
            <label class="field"><span>password</span><input type="password" name="password" minlength="6" required></label>
            <p class="field-hint">At least 6 characters.</p>
            <p class="field-error" data-form-error></p>
            <button type="submit" class="btn btn-solid" style="width:100%; justify-content:center;">create account</button>
          </form>
          <div class="or-divider">or</div>
          <button class="btn btn-google" data-google-signin>Continue with Google</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module">
  import {
    fetchRecentUsers, searchUsersByName, revokePublishing, restorePublishing,
    setUserRole, setAdminRole, fetchArticlesForModeration, setArticleStatus, addAdminNote
  } from "./js/admin.js";

  const TIER_LABEL = { administrator: "Administrator", specialAdministrator: "Special Administrator", generalAdministrator: "General Administrator" };
  const TIER_RANK = { administrator: 1, specialAdministrator: 2, generalAdministrator: 3 };

  let myUid = null;
  let myTier = null; // one of TIER_LABEL keys, or null

  function isSpecialPlus(){ return myTier && TIER_RANK[myTier] >= 2; }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- users ----------------

  function userRowHtml(u){
    const revoked = u.publishingRevoked === true;
    const theirTier = u.adminRole; // null | 'administrator' | 'specialAdministrator' | 'generalAdministrator'
    const canActOnThem = theirTier == null || isSpecialPlus(); // mirrors the rules

    let actions = '';
    if(canActOnThem){
      actions += revoked
        ? `<button class="btn" data-act="restore" data-uid="${u.uid}">restore publishing</button>`
        : `<button class="btn btn-ghost" data-act="revoke" data-uid="${u.uid}">revoke publishing</button>`;
      if(u.role !== 'starUser'){
        actions += `<button class="btn btn-ghost" data-act="grant-star" data-uid="${u.uid}">grant star user</button>`;
      }
      if(isSpecialPlus() && u.role !== 'certifiedUser'){
        actions += `<button class="btn btn-ghost" data-act="grant-certified" data-uid="${u.uid}">grant certified</button>`;
      }
      if(isSpecialPlus() && theirTier == null){
        actions += `<button class="btn btn-ghost" data-act="grant-admin" data-uid="${u.uid}">make administrator</button>`;
      }
      if(isSpecialPlus() && theirTier === 'administrator'){
        actions += `<button class="btn btn-ghost" data-act="remove-admin" data-uid="${u.uid}">remove administrator</button>`;
      }
    }

    return `
      <div class="win" style="margin-bottom:8px;">
        <div class="win-body" style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; justify-content:space-between;">
          <div>
            <strong style="color:#fff;">${escapeHtml(u.displayName)}</strong>
            <span class="muted" style="font-size:12.5px;"> · ${escapeHtml(u.email)}</span>
            <div class="stamp-row" style="margin-top:6px;">
              <span class="stamp">${u.role}</span>
              ${theirTier ? `<span class="stamp"><b>${TIER_LABEL[theirTier] || theirTier}</b></span>` : ''}
              ${revoked ? `<span class="stamp" style="color:var(--amber); border-color:#5c4420;">publishing revoked${u.revocation?.permanent ? ' · permanent' : ''}</span>` : ''}
            </div>
          </div>
          <div class="btn-row">${actions || '<span class="muted" style="font-size:12.5px;">no actions available to your tier</span>'}</div>
        </div>
      </div>`;
  }

  function renderUsers(users){
    const el = document.querySelector('[data-user-list]');
    el.innerHTML = users.length ? users.map(userRowHtml).join('') : '<p class="muted">No users found.</p>';

    el.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.uid;
        const act = btn.dataset.act;
        try{
          if(act === 'revoke'){
            const reason = prompt('Reason for revoking publishing rights?');
            if(reason === null) return;
            const permanent = isSpecialPlus() && confirm('Mark this as a permanent revocation? (Special Administrator+ only — OK = permanent, Cancel = temporary)');
            await revokePublishing(myUid, uid, reason, permanent);
          } else if(act === 'restore'){
            const reason = prompt('Reason for restoring publishing rights? (optional)') || '';
            await restorePublishing(myUid, uid, reason);
          } else if(act === 'grant-star'){
            await setUserRole(uid, 'starUser');
          } else if(act === 'grant-certified'){
            await setUserRole(uid, 'certifiedUser');
          } else if(act === 'grant-admin'){
            await setAdminRole(uid, 'administrator');
          } else if(act === 'remove-admin'){
            await setAdminRole(uid, null);
          }
          loadUsers();
        } catch(err){
          alert(err.message || 'That action failed.');
          console.error(err);
        }
      });
    });
  }

  async function loadUsers(){
    document.querySelector('[data-user-list]').innerHTML = '<p class="muted">Loading users…</p>';
    const users = await fetchRecentUsers(50);
    renderUsers(users);
  }

  document.querySelector('[data-user-search-btn]').addEventListener('click', async () => {
    const prefix = document.querySelector('[data-user-search]').value.trim();
    if(!prefix) return loadUsers();
    document.querySelector('[data-user-list]').innerHTML = '<p class="muted">Searching…</p>';
    renderUsers(await searchUsersByName(prefix));
  });
  document.querySelector('[data-user-reset-btn]').addEventListener('click', () => {
    document.querySelector('[data-user-search]').value = '';
    loadUsers();
  });

  // ---------------- articles ----------------

  function articleRowHtml(a){
    const removed = a.status === 'removed';
    const notes = (a.adminNotes || []).map(n => `<div class="muted" style="font-size:12.5px; margin-top:4px;">— ${escapeHtml(n.note)}</div>`).join('');
    return `
      <div class="win" style="margin-bottom:8px;">
        <div class="win-body">
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; justify-content:space-between;">
            <div>
              <strong style="color:#fff;"><a href="article.html?id=${a.id}" style="color:#fff;">${escapeHtml(a.title)}</a></strong>
              <span class="muted" style="font-size:12.5px;"> · by ${escapeHtml(a.authorName)} · ${a.category}</span>
              <div class="stamp-row" style="margin-top:6px;">
                <span class="stamp">${a.status}</span>
              </div>
            </div>
            <div class="btn-row">
              ${removed
                ? `<button class="btn" data-art-act="restore" data-id="${a.id}">restore</button>`
                : `<button class="btn btn-ghost" data-art-act="remove" data-id="${a.id}">remove</button>`}
              <button class="btn btn-ghost" data-art-act="note" data-id="${a.id}">add note</button>
            </div>
          </div>
          ${notes ? `<div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">${notes}</div>` : ''}
        </div>
      </div>`;
  }

  function renderArticles(articles){
    const el = document.querySelector('[data-article-list]');
    el.innerHTML = articles.length ? articles.map(articleRowHtml).join('') : '<p class="muted">No articles yet.</p>';

    el.querySelectorAll('[data-art-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const act = btn.dataset.artAct;
        try{
          if(act === 'remove'){
            if(confirm('Remove this article? It stays recoverable — this is a soft delete, not a permanent one.')){
              await setArticleStatus(id, 'removed');
            }
          } else if(act === 'restore'){
            await setArticleStatus(id, 'published');
          } else if(act === 'note'){
            const note = prompt('Admin note (not visible to readers):');
            if(!note) return;
            await addAdminNote(id, myUid, note);
          }
          loadArticles();
        } catch(err){
          alert(err.message || 'That action failed.');
          console.error(err);
        }
      });
    });
  }

  async function loadArticles(){
    document.querySelector('[data-article-list]').innerHTML = '<p class="muted">Loading articles…</p>';
    renderArticles(await fetchArticlesForModeration(50));
  }

  // ---------------- gate + boot ----------------

  document.addEventListener('dartmouth:authchange', (e) => {
    const { user, profile } = e.detail;
    myUid = user ? user.uid : null;
    myTier = profile ? profile.adminRole : null;

    const isAdmin = !!myTier;
    document.querySelector('[data-not-admin]').style.display = isAdmin ? 'none' : '';
    document.querySelector('[data-admin-root]').style.display = isAdmin ? '' : 'none';

    if(isAdmin){
      document.querySelector('[data-my-tier]').textContent = TIER_LABEL[myTier] || myTier;
      loadUsers();
      loadArticles();
    }
  });
</script>
</body>
</html>
